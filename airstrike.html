<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Strike</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #222; font-family: Arial, sans-serif; }
        canvas { border: 2px solid white; background: #87CEEB; }
        #score { position: absolute; top: 20px; color: white; font-size: 20px; }
    </style>
</head>
<body>
    <div id="score">Score: <span id="scoreVal">0</span> | Health: <span id="health">3</span></div>
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let plane = { x: 400, y: 400, width: 30, height: 20, velocityX: 0 };
        let bullets = [];
        let enemies = [];
        let score = 0;
        let health = 3;
        
        function spawnEnemy() {
            enemies.push({
                x: Math.random() * 750,
                y: Math.random() * 100 + 20,
                width: 30,
                height: 20,
                velocityX: (Math.random() - 0.5) * 3
            });
        }
        
        for (let i = 0; i < 5; i++) spawnEnemy();
        
        function draw() {
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff00';
            ctx.save();
            ctx.translate(plane.x, plane.y);
            ctx.beginPath();
            ctx.moveTo(0, -10);
            ctx.lineTo(15, 10);
            ctx.lineTo(-15, 10);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
            ctx.fillStyle = '#ffff00';
            bullets.forEach(b => ctx.fillRect(b.x, b.y, 3, 8));
            ctx.fillStyle = '#ff0000';
            enemies.forEach(e => ctx.fillRect(e.x, e.y, e.width, e.height));
        }
        
        function update() {
            if (keys['ArrowLeft'] && plane.x > 0) plane.velocityX = -6;
            else if (keys['ArrowRight'] && plane.x < 770) plane.velocityX = 6;
            else plane.velocityX *= 0.9;
            
            plane.x += plane.velocityX;
            if (keys[' ']) bullets.push({ x: plane.x + 15, y: plane.y + 10 });
            
            bullets.forEach((b, i) => {
                b.y -= 5;
                if (b.y < 0) bullets.splice(i, 1);
            });
            
            enemies.forEach((e, i) => {
                e.x += e.velocityX;
                if (e.x < 0 || e.x > 770) e.velocityX = -e.velocityX;
            });
            
            bullets.forEach((b, bi) => {
                enemies.forEach((e, ei) => {
                    if (b.x > e.x && b.x < e.x + e.width && b.y > e.y && b.y < e.y + e.height) {
                        bullets.splice(bi, 1);
                        enemies.splice(ei, 1);
                        score += 10;
                        spawnEnemy();
                    }
                });
            });
            
            enemies.forEach((e, i) => {
                if (e.y > 500) {
                    enemies.splice(i, 1);
                    health--;
                    if (health <= 0) { alert(`Game Over! Score: ${score}`); location.reload(); }
                }
            });
            
            document.getElementById('scoreVal').textContent = score;
            document.getElementById('health').textContent = health;
            draw();
        }
        
        const keys = {};
        document.addEventListener('keydown', (e) => { keys[e.key] = true; });
        document.addEventListener('keyup', (e) => { keys[e.key] = false; });
        setInterval(update, 30);
        draw();
    </script>
</body>
</html>
