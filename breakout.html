<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakout</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #222; font-family: Arial, sans-serif; }
        canvas { border: 2px solid white; background: #000; }
        #score { position: absolute; top: 20px; color: white; font-size: 20px; }
    </style>
</head>
<body>
    <div id="score">Score: <span id="scoreVal">0</span></div>
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let paddle = { x: 250, y: 370, width: 100, height: 10, dx: 0 };
        let ball = { x: 300, y: 360, radius: 5, dx: 3, dy: -3 };
        let bricks = [];
        let score = 0;
        for (let i = 0; i < 5; i++) {
            for (let j = 0; j < 8; j++) {
                bricks.push({ x: j * 75, y: i * 20 + 10, width: 70, height: 15, active: true });
            }
        }
        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            bricks.forEach(brick => {
                if (brick.active) {
                    ctx.fillStyle = '#0f0';
                    ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
                }
            });
        }
        function update() {
            ball.x += ball.dx;
            ball.y += ball.dy;
            if (ball.x < ball.radius || ball.x > canvas.width - ball.radius) ball.dx = -ball.dx;
            if (ball.y < ball.radius) ball.dy = -ball.dy;
            if (ball.y > canvas.height) { alert(`Game Over! Score: ${score}`); location.reload(); }
            if (ball.x > paddle.x && ball.x < paddle.x + paddle.width && ball.y > paddle.y && ball.y < paddle.y + paddle.height) ball.dy = -ball.dy;
            bricks.forEach(brick => {
                if (brick.active && ball.x > brick.x && ball.x < brick.x + brick.width && ball.y > brick.y && ball.y < brick.y + brick.height) {
                    brick.active = false;
                    ball.dy = -ball.dy;
                    score += 10;
                    document.getElementById('scoreVal').textContent = score;
                }
            });
            if (bricks.every(b => !b.active)) { alert(`You Won! Score: ${score}`); location.reload(); }
            draw();
        }
        document.addEventListener('mousemove', (e) => { paddle.x = e.clientX - canvas.offsetLeft - paddle.width / 2; });
        setInterval(update, 30);
        draw();
    </script>
</body>
</html>
