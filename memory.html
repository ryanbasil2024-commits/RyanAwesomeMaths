<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <style>
        body { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); font-family: Arial, sans-serif; }
        #gameBoard { display: grid; grid-template-columns: repeat(4, 80px); gap: 10px; }
        .card { width: 80px; height: 80px; background: #0066ff; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 40px; color: transparent; transition: all 0.3s; }
        .card:hover { transform: scale(1.05); }
        .card.flipped { background: white; color: black; }
        #score { color: white; font-size: 24px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div id="score">Matched: <span id="matched">0</span>/8</div>
    <div id="gameBoard"></div>
    <script>
        const pairs = ['🍎', '🍎', '🍊', '🍊', '🍋', '🍋', '🍌', '🍌', '🍉', '🍉', '🍓', '🍓', '🍇', '🍇', '🍒', '🍒'];
        let shuffled = pairs.sort(() => Math.random() - 0.5);
        let matched = 0;
        let firstCard = null;
        let secondCard = null;
        let lockBoard = false;
        const board = document.getElementById('gameBoard');
        shuffled.forEach((emoji, i) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.emoji = emoji;
            card.dataset.index = i;
            card.textContent = '?';
            card.addEventListener('click', flipCard);
            board.appendChild(card);
        });
        function flipCard(e) {
            if (lockBoard || e.target === firstCard) return;
            e.target.classList.add('flipped');
            e.target.textContent = e.target.dataset.emoji;
            if (!firstCard) {
                firstCard = e.target;
            } else {
                secondCard = e.target;
                lockBoard = true;
                if (firstCard.dataset.emoji === secondCard.dataset.emoji) {
                    matched++;
                    document.getElementById('matched').textContent = matched;
                    firstCard = null;
                    secondCard = null;
                    lockBoard = false;
                    if (matched === 8) { alert('You Won!'); location.reload(); }
                } else {
                    setTimeout(() => {
                        firstCard.classList.remove('flipped');
                        firstCard.textContent = '?';
                        secondCard.classList.remove('flipped');
                        secondCard.textContent = '?';
                        firstCard = null;
                        secondCard = null;
                        lockBoard = false;
                    }, 800);
                }
            }
        }
    </script>
</body>
</html>
