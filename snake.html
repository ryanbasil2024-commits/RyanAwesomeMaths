<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #222;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid white;
            background: #000;
        }
        #info {
            position: absolute;
            top: 20px;
            color: white;
            font-size: 20px;
        }
        #score {
            color: #0f0;
        }
    </style>
</head>
<body>
    <div id="info">
        Score: <span id="score">0</span> | High: <span id="high">0</span>
    </div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const highDisplay = document.getElementById('high');

        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let dx = 1;
        let dy = 0;
        let score = 0;
        let high = localStorage.getItem('snakeHigh') || 0;
        let gameRunning = true;

        highDisplay.textContent = high;

        const gridSize = 20;

        function drawSquare(x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x * gridSize, y * gridSize, gridSize, gridSize);
        }

        function update() {
            if (!gameRunning) return;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            if (head.x < 0 || head.x >= canvas.width / gridSize || 
                head.y < 0 || head.y >= canvas.height / gridSize ||
                snake.some(s => s.x === head.x && s.y === head.y)) {
                gameRunning = false;
                alert(`Game Over! Score: ${score}`);
                location.reload();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreDisplay.textContent = score;
                if (score > high) {
                    high = score;
                    highDisplay.textContent = high;
                    localStorage.setItem('snakeHigh', high);
                }
                food = {x: Math.floor(Math.random() * (canvas.width / gridSize)), 
                       y: Math.floor(Math.random() * (canvas.height / gridSize))};
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            snake.forEach(s => drawSquare(s.x, s.y, '#0f0'));
            drawSquare(food.x, food.y, '#f00');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -1; }
            if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = 1; }
            if (e.key === 'ArrowLeft' && dx === 0) { dx = -1; dy = 0; }
            if (e.key === 'ArrowRight' && dx === 0) { dx = 1; dy = 0; }
        });

        setInterval(update, 100);
        draw();
    </script>
</body>
</html>
