<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turret Defense</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #222; font-family: Arial, sans-serif; }
        canvas { border: 2px solid white; background: #1a1a1a; }
        #score { position: absolute; top: 20px; color: white; font-size: 20px; }
    </style>
</head>
<body>
    <div id="score">Score: <span id="scoreVal">0</span> | Ammo: <span id="ammo">100</span></div>
    <canvas id="gameCanvas" width="700" height="500"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let turret = { x: 350, y: 450, angle: 0 };
        let bullets = [];
        let enemies = [];
        let score = 0;
        let ammo = 100;
        
        function spawnEnemy() {
            enemies.push({
                x: Math.random() * 650,
                y: 20,
                width: 25,
                height: 25,
                velocityY: 2
            });
        }
        
        for (let i = 0; i < 3; i++) spawnEnemy();
        
        function draw() {
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(turret.x, turret.y);
            ctx.rotate(turret.angle);
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(-10, -30, 20, 30);
            ctx.restore();
            ctx.fillStyle = '#ffff00';
            bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI * 2); ctx.fill(); });
            ctx.fillStyle = '#ff0000';
            enemies.forEach(e => ctx.fillRect(e.x, e.y, e.width, e.height));
        }
        
        function update() {
            if (keys['ArrowLeft']) turret.angle -= 0.1;
            if (keys['ArrowRight']) turret.angle += 0.1;
            if (keys[' '] && ammo > 0) {
                bullets.push({
                    x: turret.x + Math.cos(turret.angle) * 30,
                    y: turret.y + Math.sin(turret.angle) * 30,
                    velocityX: Math.cos(turret.angle) * 7,
                    velocityY: Math.sin(turret.angle) * 7
                });
                ammo--;
            }
            
            bullets.forEach((b, i) => {
                b.x += b.velocityX;
                b.y += b.velocityY;
                if (b.x < 0 || b.x > 700 || b.y < 0 || b.y > 500) bullets.splice(i, 1);
            });
            
            enemies.forEach((e, i) => {
                e.y += e.velocityY;
                if (e.y > 500) {
                    enemies.splice(i, 1);
                    spawnEnemy();
                }
            });
            
            bullets.forEach((b, bi) => {
                enemies.forEach((e, ei) => {
                    if (b.x > e.x && b.x < e.x + e.width && b.y > e.y && b.y < e.y + e.height) {
                        bullets.splice(bi, 1);
                        enemies.splice(ei, 1);
                        score += 15;
                        spawnEnemy();
                    }
                });
            });
            
            document.getElementById('scoreVal').textContent = score;
            document.getElementById('ammo').textContent = ammo;
            draw();
        }
        
        const keys = {};
        document.addEventListener('keydown', (e) => { keys[e.key] = true; });
        document.addEventListener('keyup', (e) => { keys[e.key] = false; });
        setInterval(update, 30);
        draw();
    </script>
</body>
</html>
